name: EvalOps Regression Test
description: Run a Qubrid EvalOps evaluation and fail the workflow on regression.

inputs:
  api-url:
    description: EvalOps API URL
    required: true

  project-id:
    description: EvalOps project ID
    required: true

  ci-token:
    description: Project CI token
    required: true

  dataset-id:
    description: Evaluation dataset ID
    required: true

runs:
  using: node24
  main: dist/index.js

