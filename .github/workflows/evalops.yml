name: EvalOps Regression

on:
  pull_request:
    branches:
      - main

jobs:
  evalops:
    name: AI Regression Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run EvalOps Regression
        uses: ./github-action
        with:
          api-url: ${{ secrets.EVALOPS_API_URL }}
          project-id: ${{ secrets.EVALOPS_PROJECT_ID }}
          ci-token: ${{ secrets.EVALOPS_CI_TOKEN }}